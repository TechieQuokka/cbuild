[package]
name = "cbuild"
version = "0.1.0"
edition = "2024"
description = "A Cargo-like build tool for C"
license = "MIT"
readme = "README.md"

[[bin]]
name = "cman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
